<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ЕкоАйко</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5FAF2;--card:#fff;--ink:#1F3A2C;--green:#3E8E5A;--moss:#DCEBD0;--sky:#DCEEF3;--sun:#F3C64D;--muted:#5D7466;--line:rgba(31,58,44,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12201A;--card:#1A2E24;--ink:#EAF4E6;--moss:#25402F;--sky:#1F3A42;--muted:#A5BDAE;--line:rgba(234,244,230,.15)}}
:root[data-theme="dark"]{--bg:#12201A;--card:#1A2E24;--ink:#EAF4E6;--moss:#25402F;--sky:#1F3A42;--muted:#A5BDAE;--line:rgba(234,244,230,.15)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;line-height:1.55}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 0}
.logo{font-weight:800;font-size:24px;color:var(--green);display:flex;align-items:center;gap:10px}
.logo::before{content:"";width:22px;height:22px;background:var(--green);border-radius:0 100% 0 100%}
nav a{text-decoration:none;font-weight:700;margin-left:22px}
nav a:hover{color:var(--green)}
.hero{background:var(--moss);border-radius:40px;padding:64px 48px;position:relative;overflow:hidden;min-height:340px}
.hero h1{font-size:clamp(32px,6vw,58px);line-height:1.08;font-weight:800;margin:0 0 16px;max-width:13ch;position:relative}
.hero p{font-size:18px;max-width:44ch;margin:0 0 28px;color:var(--muted);position:relative}
.leaf{position:absolute;background:var(--green);border-radius:0 100% 0 100%}
.l1{width:280px;height:280px;right:-40px;top:-30px;opacity:.9;transform:rotate(8deg)}
.l2{width:150px;height:150px;right:200px;bottom:-40px;background:var(--sky);transform:rotate(-20deg)}
.l3{width:70px;height:70px;right:70px;bottom:50px;background:var(--sun);border-radius:50%}
.btn{display:inline-block;background:var(--green);color:#fff;font-weight:700;padding:13px 26px;border-radius:999px;text-decoration:none;border:0;cursor:pointer;font-family:inherit;font-size:16px}
.btn:hover{filter:brightness(1.1)}
h2{font-size:32px;font-weight:800;margin:56px 0 16px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}
.chip{border:2px solid var(--green);background:transparent;color:var(--green);padding:8px 18px;border-radius:999px;font-weight:700;cursor:pointer;font-family:inherit;font-size:15px}
.chip[aria-pressed="true"]{background:var(--green);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.card{background:var(--card);border-radius:28px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.pic{height:150px;background:var(--moss);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:14px 16px;font-weight:700;font-size:14px;color:var(--muted)}
.pic.has{padding:0;background:#fff}.pic.has img{width:100%;height:100%;object-fit:contain;position:absolute;inset:0;z-index:1}.pic.has::after{display:none}
.pic::after{content:"";position:absolute;right:-18px;top:-18px;width:110px;height:110px;background:var(--green);opacity:.85;border-radius:0 100% 0 100%;transform:rotate(10deg)}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:4px;flex:1}
.body b{font-size:18px;line-height:1.25}
.body span{color:var(--muted);font-size:14px}
.price{font-weight:800;font-size:21px;margin-top:auto;padding-top:10px}
.price.none{font-size:15px;font-weight:700;color:var(--muted)}
.card .btn{text-align:center;margin-top:10px;padding:11px}
.contact{background:var(--green);color:#fff;border-radius:36px;padding:40px;margin:64px 0 32px;display:flex;gap:24px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.contact h2{margin:0 0 8px;color:#fff}
.contact p{margin:0;opacity:.92}
.contact .btn{background:#fff;color:#1F3A2C}
footer{text-align:center;color:var(--muted);padding:0 0 32px;font-size:14px}
@media (max-width:600px){.hero{padding:40px 26px;border-radius:32px}.l2,.l3{display:none}.contact{padding:28px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" id="shopName"></div>
    <nav><a href="#catalog">Каталог</a><a href="#contact">Байланыс</a></nav>
  </header>

  <section class="hero">
    <span class="leaf l1"></span><span class="leaf l2"></span><span class="leaf l3"></span>
    <h1>Таза сүт өнімдері</h1>
    <p>Шин-Лайн сүті мен балмұздағы және басқа тауарлар. Таңдап, WhatsApp арқылы тапсырыс беріңіз.</p>
    <a class="btn" href="#catalog">Каталогқа өту</a>
  </section>

  <h2 id="catalog">Каталог</h2>
  <div class="chips" id="chips" role="group" aria-label="Санат"></div>
  <div class="grid" id="grid"></div>

  <section class="contact" id="contact">
    <div>
      <h2>Тапсырыс беру</h2>
      <p id="contactText"></p>
    </div>
    <a class="btn" id="waMain" target="_blank" rel="noopener">WhatsApp-қа жазу</a>
  </section>
  <footer id="foot"></footer>
</div>

/* ================================== */

const $ = id => document.getElementById(id);
$("shopName").textContent = SHOP;
document.title = SHOP;
$("contactText").textContent = ADDRESS;
$("foot").textContent = "© " + SHOP;
const wa = t => "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(t);
$("waMain").href = wa("Сәлем! Тапсырыс бергім келеді.");

const cats = ["Барлығы", ...Object.keys(COLORS)];
let active = "Барлығы";

function render(){
  $("chips").innerHTML = "";
  cats.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = c;
    b.setAttribute("aria-pressed", c === active);
    b.onclick = () => { active = c; render(); };
    $("chips").appendChild(b);
  });
  $("grid").innerHTML = "";
  PRODUCTS.filter(p => active === "Барлығы" || p.cat === active).forEach(p => {
    const d = document.createElement("article");
    d.className = "card";
    const priceHtml = p.price == null
      ? '<div class="price none">Бағасын сұраңыз</div>'
      : '<div class="price">' + Number(p.price).toLocaleString("ru-RU") + ' ₸</div>';
    d.innerHTML = '<div class="pic"></div>' +
      '<div class="body"><b></b><span></span>' + priceHtml +
      '<a class="btn" target="_blank" rel="noopener">Тапсырыс беру</a></div>';
    const pic = d.querySelector(".pic");
    if (p.img) { pic.classList.add("has"); const im = document.createElement("img"); im.src = p.img; im.alt = p.name; pic.appendChild(im); }
    else pic.textContent = p.cat;
    d.querySelector("b").textContent = p.name;
    d.querySelector("span").textContent = p.info;
    d.querySelector("a").href = wa("Сәлем! Мына өнімді алғым келеді: " + p.name);
    $("grid").appendChild(d);
  });
}
render();
</script>
